    <!----- js for toggle menu ----->

       <script>
        var MenuItems = document.getElementById("MenuItems");
        MenuItems.style.maxHeight = "0px"
        function menutoggle(){
            if(MenuItems.style.maxHeight == "0px")
            {
                MenuItems.style.maxHeight = "200px"
            }
            else
            {
                MenuItems.style.maxHeight = "0px"
            }
        }
       </script>

    <!----- product data + cart + rendering ----->
    <script src="products-data.js"></script>
    <script src="cart.js"></script>
    <script>
        // If we arrived here from a homepage category tile (?category=vases etc),
        // only show products in that category.
        var categoryFilter = getQueryParam("category");

        function getBaseList() {
            if (categoryFilter) {
                return PRODUCTS.filter(function(p){ return p.category === categoryFilter; });
            }
            return PRODUCTS.slice(); // copy so we don't mutate the original
        }

        function renderSorted(sortValue) {
            var list = getBaseList();
            if (sortValue === "price-asc") {
                list.sort(function(a, b){ return a.price - b.price; });
            } else if (sortValue === "price-desc") {
                list.sort(function(a, b){ return b.price - a.price; });
            } else if (sortValue === "rating") {
                list.sort(function(a, b){ return b.rating - a.rating; });
            }
            renderGrid("all-products", list);
        }

        // If the category has no matching products, or wasn't a real category,
        // just fall back to showing everything rather than an empty page.
        if (categoryFilter && getBaseList().length === 0) {
            categoryFilter = null;
        }

        // Update the heading + show a "view all" link when filtered
        if (categoryFilter) {
            var label = categoryFilter.charAt(0).toUpperCase() + categoryFilter.slice(1);
            var titleEl = document.getElementById("page-title");
            titleEl.innerHTML = label + ' <a href="products.html" style="font-size:14px; color:#ff523b; margin-left:10px;">(view all products)</a>';
        }

        // Initial render, default order
        renderSorted("default");
        updateCartBadge();

        // Re-render whenever the dropdown changes
        document.getElementById("sort-select").addEventListener("change", function(e){
            renderSorted(e.target.value);
        });
    </script>

<script src="script.js"></script>
