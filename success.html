    <!----- js for toggle menu ----->

       <script>
        var MenuItems = document.getElementById("MenuItems");
        MenuItems.style.maxHeight = "0px"
        function menutoggle(){
            if(MenuItems.style.maxHeight == "0px")
            {
                MenuItems.style.maxHeight = "200px"
            }
            else
            {
                MenuItems.style.maxHeight = "0px"
            }
        }
       </script>

    <!----- verify the payment before trusting it, then clear the cart ----->
    <script src="products-data.js"></script>
    <script src="cart.js"></script>
    <script>
        const BACKEND_URL = "http://localhost:4242";
        const reference = new URLSearchParams(window.location.search).get("reference");
        const resultContainer = document.getElementById("ResultContainer");

        function showSuccess() {
            resultContainer.innerHTML = `
                <i class="fa fa-check-circle" style="font-size:60px; color:#ff523b;"></i>
                <h2 style="margin: 20px 0;">Thank you for your order!</h2>
                <p style="color:#555;">Your payment was successful. A confirmation has been sent to your email.</p>
                <br>
                <a href="products.html" class="btn">Continue Shopping &#8594;</a>
            `;
            saveCart([]); // only clear the cart once payment is actually confirmed
            updateCartBadge();
        }

        function showFailure() {
            resultContainer.innerHTML = `
                <h2 style="margin: 20px 0; color:#ff523b;">We couldn't confirm this payment</h2>
                <p style="color:#555;">If you completed payment, please contact us with your reference. Otherwise, your cart is still saved.</p>
                <br>
                <a href="cart.html" class="btn">Back to Cart &#8594;</a>
            `;
            updateCartBadge();
        }

        if (!reference) {
            showFailure();
        } else {
            fetch(BACKEND_URL + "/verify-payment/" + encodeURIComponent(reference))
                .then(function(res){ return res.json(); })
                .then(function(data){
                    if (data.verified) {
                        showSuccess();
                    } else {
                        showFailure();
                    }
                })
                .catch(function(err){
                    console.error(err);
                    showFailure();
                });
        }
    </script>

<script src="script.js"></script>
